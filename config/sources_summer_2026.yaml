# =============================================================================
# Sources de collecte — BIDUL D'ÉTÉ 2026 (juillet + août)
# =============================================================================
# Config partagée pour les 2 mois. Utiliser avec :
#
#   tapageur collect --month 2026-07 --month 2026-08 \
#                    -c config/sources_summer_2026.yaml
#
# Le multi-mois mutualise les fetches HTTP cross-mois (Superforma fetché
# 1 fois pour les 2 mois). Voir docs/workflow.md section "Bidul d'été".
#
# Workflow complet :
# 1. Drag-and-drop des fichiers dans :
#    - sources/docs/2026-07/, sources/docs/2026-08/ (spécifique au mois)
#    - sources/docs/2026-summer/ (partagé pour les 2 mois)
#    - sources/mailbox_export/2026-07/, sources/mailbox_export/2026-08/
# 2. tapageur collect --month 2026-07 --month 2026-08 -c <ce fichier>
# 3. tapageur normalize --month 2026-07 && tapageur normalize --month 2026-08
# 4. tapageur preview --month 2026-07 && tapageur preview --month 2026-08
# 5. Validation manuelle dans LibreOffice
# 6. tapageur push --month 2026-07 && tapageur push --month 2026-08
# 7. Biduleur fusionne les 2 CSV en 1 PDF via summer_mode (PR #106).
# =============================================================================


# === Sites web ===
websites:
  # ─── Sources récurrentes ────────────────────────────────────────────
  - name: superforma
    url: https://superforma.fr/agenda
    needs_browser: true
    note: "SMAC — concerts (Le Scarron, Le Médiator)"

  - name: bistrobroccafe
    url: https://bistrobroccafe.e-monsite.com/
    follow_event_links: false

  - name: musiquesmagiques
    url: https://www.musiquesmagiques.fr/Agenda/index.php
    follow_event_links: false

  - name: lafonderie
    url: https://www.lafonderie.fr/les-ouvertures-publiques/
    follow_event_links: true

  # ─── FESTIVALS — mode classique (events séparés) ────────────────────
  # Chaque concert/spectacle du festival devient une ligne dans le sheet.

  - name: ofcourselemans
    url: https://msj.world/ofcourselemans/86
    follow_event_links: false

  - name: pleinchamp
    url: https://pleinchamplemans.fr/le-festival/concerts-et-dj-sets/
    follow_event_links: false

  - name: atoutboutdchamp
    url: https://www.festivalatoutboutdchamp.com/programmation/
    follow_event_links: false

  - name: beauxdimanches
    url: https://www.tourisme-alpesmancelles.com/envie-de-sortir/culture-sports-et-loisirs/les-beaux-dimanches-apres-midis-ou-sort-le-soleil-dan-saint-leonard-des-bois-fr-5736575/
    follow_event_links: false

  - name: cheronne
    url: https://festivaldelacheronne.com/programmation-2024/
    follow_event_links: false
    note: "URL avec /programmation-2024/ — vérifier si une /programmation-2026/ existe"

  - name: bonnzik
    url: https://superforma.fr/mediator/la-bonn-zik-festival-d-ete-bonnetable
    needs_browser: true                # même config que superforma (sous-page)
    follow_event_links: false

  - name: lesgarennes
    url: https://www.les-garennes.fr/programmation
    follow_event_links: false

  - name: pianoctambule
    url: https://www.pianoctambule.com/pianoaujardin
    follow_event_links: false

  - name: tuffeeries
    url: https://www.helloasso.com/associations/comite-des-fetes-de-tuffe/evenements/festival-des-tuffeeries-2026
    needs_browser: true                # HelloAsso = Cloudflare anti-bot
    follow_event_links: false

  - name: intergalactik
    url: https://www.helloasso.com/associations/festival-intergalactik-de-clowns-de-jupilles-and-co/evenements/billetterie-festival-intergalactik-de-clowns-de-jupilles-2025
    needs_browser: true                # HelloAsso = Cloudflare anti-bot
    follow_event_links: false
    note: "URL contient 2025 — vérifier si l'édition 2026 existe"

  - name: fb_event_1549364973
    url: https://www.facebook.com/events/1549364973433131
    needs_browser: true
    follow_event_links: false
    note: "Page event FB publique : Meta force le login wall depuis 2020. Probable
           échec — fallback : drop screenshot/PDF dans sources/docs/2026-summer/."

  # ─── FESTIVALS — mode onliner ───────────────────────────────────────
  # Une seule ligne "Festivals" dans le CSV (rendu par biduleur PR#106).

  - name: les_affranchis
    url: https://lecarroi.org/les-affranchis/
    follow_event_links: false
    mode: festival_onliner

  - name: zarts_sur_lherbe
    url: https://www.fest.fr/fete-nationale-quotles-z-arts-sur-l-herbequot-2534862.html
    follow_event_links: false
    mode: festival_onliner


# === Outlook (Graph API) ===
outlook:
  enabled: false


# === Mailbox locale ===
# Le mois courant (passé en CLI) est concaténé automatiquement :
# multi-mois → lit sources/mailbox_export/2026-07/ puis sources/mailbox_export/2026-08/
mailbox:
  base_dir: sources/mailbox_export


# === PDFs saison (locaux uniquement) ===
season_pdfs:
  - path: "./sources/pdfs_saison/Programme Acthalia saison 2025-2026.pdf"
    parsed_cache: ./cache/pdf_acthalia_25_26.json
    label: "Programme saison 25-26 — Théâtre de l'Acthalia"


# === Facebook ===
facebook:
  enabled: false


# === Docs du mois (images + PDFs déposés manuellement) ===
docs:
  paths:
    - sources/docs/{month}/        # par mois — 2026-07/ puis 2026-08/
    - sources/docs/2026-summer/    # partagé pour les 2 mois (PDF + photos festivals)


# === Filtre temporel ===
filter:
  margin_days: 3
