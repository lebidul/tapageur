# === Festivals à convertir en onliner (post-normalisation) ===
# Ces festivals sont extraits « en pièces détachées » par le pipeline (typique :
# le LeMans_Guide-ete-2026.pdf liste chaque concert des Mardis de la Chanson
# comme un event indépendant, ou chaque soirée des Nouveaux Mystères comme
# un pestacle séparé). Après extraction, tapageur les regroupe en 1 seul
# Event onliner par nom de festival, qui produit 1 ligne « Festivals » au CSV.
# Matching : case-insensitive, whitespace-stripped, sur ev.festival.
#festivals_as_onliner:
#  - "Les Mardis de la Chanson"
#  - "Les Nouveaux Mystères de la Cathédrale"


# === Filtre temporel ===
filter:
  margin_days: 3
