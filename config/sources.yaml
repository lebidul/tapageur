# Sources récurrentes du tapage biduleur.
# À ajuster une fois, ré-utilisable chaque mois.

# === Sites web (1 entrée par site ; le texte est extrait par Claude au moment
# de la normalisation, pas de scraper dédié) ===
websites:
  - name: superforma
    url: https://superforma.fr/agenda
    needs_browser: true           # 403 sans bons headers → Playwright
    note: "SMAC — concerts (Le Scarron, Le Médiator)"

  # À réactiver une fois superforma validé :
  # - name: leplongeoir
  #   url: https://leplongeoir-cirque.fr/agenda/
  #   needs_browser: false
  #   note: "Cirque — agenda saison"

# === Outlook (Microsoft 365 / live.fr / outlook.com via Graph API) ===
# Désactivé : Microsoft a verrouillé la création d'App Registration pour les
# comptes Microsoft personnels (live.fr) sans tenant Azure AD. Voir le
# connecteur `mailbox` ci-dessous pour le bypass via export manuel.
outlook:
  enabled: false
  folders:
    - "Bidul/Agendas"
    - "Bidul/CommuniquesPresse"
  since_days: 60

# === Mailbox locale (bypass de l'API Outlook) ===
# Drag-and-drop des mails utiles depuis Outlook Web (.eml) ou Outlook Desktop
# (.msg) vers sources/mailbox_export/<YYYY-MM>/. Pas d'auth, pas de tenant.
# Pièces jointes images/PDF extraites automatiquement comme items distincts.
mailbox:
  base_dir: sources/mailbox_export

# === PDFs saison (parsés une fois, ensuite cachés) ===
# Uniquement des chemins LOCAUX. Les PDFs distribués via URL doivent passer
# par la section `websites` (le connecteur web détecte le Content-Type pdf
# et route automatiquement).
season_pdfs:
  - path: "./sources/pdfs_saison/Programme Acthalia saison 2025-2026.pdf"
    parsed_cache: ./cache/pdf_acthalia_25_26.json
    label: "Programme saison 25-26 — Théâtre de l'Acthalia"

# === Facebook (page Le Bidul) ===
# DÉSACTIVÉ : Meta cache le contenu des events repostés d'autres pages (limite
# 2018+, et le scraping de la page publique facebook.com/events/<id>/ renvoie
# une erreur 400 depuis ~2020). Le connecteur ne capture donc que les events
# créés par Le Bidul lui-même + les posts texte, ce qui est largement redondant
# avec les autres sources (mailbox, web, flyers/images).
# Le code reste en place dans tapageur/connectors/fb.py au cas où Meta
# rouvrirait l'accès, ou pour réactivation manuelle ponctuelle.
facebook:
  enabled: false
  page_id: me
  since_days: 60

# === Flyers / images du mois (à déposer manuellement) ===
# TODO (commit suivant) : rebaptiser flyers → docs et accepter PDF + paths list.
flyers:
  base_dir: ./sources/docs
  # Les images sont attendues dans ./sources/docs/<YYYY-MM>/
  # OCR via PaddleOCR + Claude vision pour structurer.

# === Filtre temporel ===
filter:
  # Mois ciblé est passé en CLI (--month YYYY-MM).
  # Une marge de tolérance permet d'inclure les events à cheval mois précédent/suivant.
  margin_days: 3
