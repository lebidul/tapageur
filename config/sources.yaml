# Sources récurrentes du tapage biduleur.
# À ajuster une fois, ré-utilisable chaque mois.

# === Sites web (1 entrée par site ; le texte est extrait par Claude au moment
# de la normalisation, pas de scraper dédié) ===
websites:
  - name: superforma
    url: https://superforma.fr/agenda
    needs_browser: true           # 403 sans bons headers → Playwright
    note: "SMAC — concerts (Le Scarron, Le Médiator)"

  # À réactiver une fois superforma validé :
  # - name: leplongeoir
  #   url: https://leplongeoir-cirque.fr/agenda/
  #   needs_browser: false
  #   note: "Cirque — agenda saison"

# === Outlook (Microsoft 365 / live.fr / outlook.com via Graph API) ===
outlook:
  enabled: false                # désactivé tant que MSAL_CLIENT_ID pas configuré
  folders:
    - "Bidul/Agendas"
    - "Bidul/CommuniquesPresse"
  since_days: 60

# === PDFs saison (parsés une fois, ensuite cachés) ===
# `path` peut être un chemin local ou une URL — dans ce cas le PDF est
# téléchargé dans ./season_pdfs/<basename>.pdf (gitignored).
season_pdfs:
  - path: "./season_pdfs/Programme Acthalia saison 2025-2026.pdf"
    parsed_cache: ./cache/pdf_acthalia_25_26.json
    label: "Programme saison 25-26 — Théâtre de l'Acthalia"

# === Facebook (page Le Bidul uniquement — events des autres pages plus accessibles) ===
facebook:
  enabled: false                # à activer quand tu as le page access token
  page_id: lebidul
  kinds:
    - events

# === Flyers / images du mois (à déposer manuellement) ===
flyers:
  base_dir: ./flyers
  # Les images sont attendues dans ./flyers/<YYYY-MM>/
  # OCR via PaddleOCR + Claude vision pour structurer.

# === Filtre temporel ===
filter:
  # Mois ciblé est passé en CLI (--month YYYY-MM).
  # Une marge de tolérance permet d'inclure les events à cheval mois précédent/suivant.
  margin_days: 3
