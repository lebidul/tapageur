<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #2b6cb0;
    --accent-dark: #22508a;
    --accent-contrast: #ffffff;
    --warning: #a4400f;
    --bg: #eef2f7;
    --card: #ffffff;
    --panel-bg: #f6f6f6;
    --border: #cbd5e0;
    --text: #1a202c;
    --muted: #4a5568;
    --drop-border: #888;
    --drop-text: #666;
    --button-bg: #ffffff;
  }
  [data-theme="dark"] {
    --accent: #63b3ed;
    --accent-dark: #4a90d9;
    --accent-contrast: #1a202c;
    --warning: #fc8181;
    --bg: #1e2227;
    --card: #272c33;
    --panel-bg: #22262c;
    --border: #3a4049;
    --text: #e4e7eb;
    --muted: #a0aec0;
    --drop-border: #5a616b;
    --drop-text: #a0aec0;
    --button-bg: #2f353d;
  }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--text); }
  h1 { font-size: 20px; color: var(--accent); border-bottom: 3px solid var(--accent); padding-bottom: 6px; }
  h2 { color: var(--accent-dark); }
  fieldset { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 10px 14px; box-shadow: 0 1px 3px rgba(16,42,67,.06); }
  legend { color: var(--accent-dark); font-weight: 600; }
  #drop { border: 2px dashed var(--drop-border); border-radius: 8px; padding: 24px; text-align: center; color: var(--drop-text); transition: border-color .15s, color .15s; }
  #drop:hover { border-color: var(--accent); color: var(--accent); }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  .url-row { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  .url-row input[type=text] { flex: 1; }
  #summary { white-space: pre-wrap; background: var(--panel-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
  #summary .result-head { font-weight: 600; color: var(--accent-dark); }
  #summary .source-head { font-weight: 600; color: var(--accent); margin-top: 4px; }
  .alert { color: var(--warning); }
  #elapsed { color: var(--accent); font-weight: 600; }
  #progress { color: var(--muted); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; margin-bottom: 8px; }
  #progress div { padding: 1px 0; }
  button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--button-bg); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #run, #save-settings { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 600; }
  #run:hover, #save-settings:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  #run { font-size: 15px; padding: 8px 20px; }
  #header { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 3px solid var(--accent); padding-bottom: 6px; margin-bottom: 12px; }
  #header h1 { border-bottom: none; padding-bottom: 0; margin: 0; }
  #theme-toggle { font-size: 16px; line-height: 1; padding: 4px 10px; }
</style>
</head>
<body>
  <div id="header">
    <h1>tapageur</h1>
    <button id="theme-toggle" title="Basculer clair / sombre" aria-label="Basculer le thème">☀</button>
  </div>

  <fieldset>
    <legend>Fichiers (PDF, JPG, PNG)</legend>
    <div id="drop">Dépose des fichiers ici (ou clique pour choisir)</div>
    <ul id="file-list"></ul>
  </fieldset>

  <fieldset>
    <legend>URLs</legend>
    <div id="urls"></div>
    <button id="add-url">+ Ajouter une URL</button>
  </fieldset>

  <datalist id="venues"></datalist>

  <fieldset>
    <legend>Textes</legend>
    <div id="texts"></div>
    <button id="add-text">+ Ajouter un texte</button>
  </fieldset>

  <fieldset>
    <legend>Mois</legend>
    <label><input type="radio" name="month-mode" value="specific" checked> Un mois précis</label>
    <label><input type="radio" name="month-mode" value="all"> Tous les mois des sources</label>
    <div id="month-specific" style="margin-top:8px;">
      <input id="months" type="text" placeholder="2026-10, 2026-11" size="30">
    </div>
    <div id="month-all" style="margin-top:8px; display:none;">
      <label>Année de référence <input id="reference-year" type="text" size="6"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Sortie</legend>
    <label><input type="checkbox" class="fmt" value="xlsx" checked> xlsx</label>
    <label><input type="checkbox" class="fmt" value="csv"> csv</label>
    <label><input type="checkbox" class="fmt" value="json"> json</label>
    <div style="margin-top:8px">
      <div>Écriture (xlsx) :</div>
      <label><input type="radio" name="write-mode" value="create" checked> Créer / écraser</label>
      <label><input type="radio" name="write-mode" value="append"> Ajouter (incrémental — ignore les sources déjà présentes)</label>
      <label><input type="radio" name="write-mode" value="merge"> Fusionner (compléter / ajouter sans écraser)</label>
    </div>
    <div style="margin-top:8px">
      <button id="choose-dir">Dossier de sortie…</button>
      <span id="out-dir">(aucun)</span>
    </div>
  </fieldset>

  <fieldset>
    <legend>Réglages</legend>
    <div><label>Clé API Anthropic <input id="api-key" type="password" size="40"></label></div>
    <div><label>Email tapeur <input id="email" type="text" size="30"></label></div>
    <button id="save-settings">Enregistrer les réglages</button>
    <div style="margin-top:8px;">
      <label><input id="debug-mode" type="checkbox"> mode debug (sauver config + logs dans debug/)</label>
      <button id="import-config" type="button" style="margin-left:12px;">Importer une config</button>
    </div>
  </fieldset>

  <button id="run">Lancer</button>
  <h2>Résumé <span id="elapsed"></span></h2>
  <div id="progress"></div>
  <div id="summary">—</div>

<script>
const api = () => window.pywebview.api;
let files = [];
let outDir = "";

// Lignes construites via DOM (createElement + .textContent/.value) : aucune
// chaîne dynamique (chemin, lieu, asso) injectée en innerHTML.
function renderFiles() {
  const list = document.getElementById('file-list');
  list.textContent = '';
  files.forEach((f, i) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = f.path;
    const venue = document.createElement('input');
    venue.type = 'text'; venue.className = 'f-venue';
    venue.setAttribute('list', 'venues'); venue.placeholder = 'Lieu (si absent)';
    venue.value = f.venue;
    venue.style.marginLeft = '8px';
    venue.addEventListener('input', () => { files[i].venue = venue.value; });
    const orga = document.createElement('input');
    orga.type = 'text'; orga.className = 'f-orga';
    orga.placeholder = 'Asso/festival (si absent)';
    orga.value = f.info_orga;
    orga.style.marginLeft = '4px';
    orga.addEventListener('input', () => { files[i].info_orga = orga.value; });
    const festLabel = document.createElement('label');
    festLabel.style.marginLeft = '4px';
    const fest = document.createElement('input');
    fest.type = 'checkbox'; fest.className = 'f-fest'; fest.checked = f.is_festival;
    fest.addEventListener('change', () => { files[i].is_festival = fest.checked; });
    festLabel.appendChild(fest);
    festLabel.appendChild(document.createTextNode(' festival (une ligne)'));
    const rm = document.createElement('button');
    rm.type = 'button'; rm.textContent = '×'; rm.title = 'Retirer ce fichier';
    rm.style.marginLeft = '8px';
    rm.addEventListener('click', () => { files.splice(i, 1); renderFiles(); });
    li.appendChild(span); li.appendChild(venue); li.appendChild(orga);
    li.appendChild(festLabel); li.appendChild(rm);
    list.appendChild(li);
  });
}

function collectFiles() {
  return files.filter(f => f.path);
}

// --- drop zone ---
const drop = document.getElementById('drop');
// Sélection fiable : dialogue natif pywebview (renvoie de vrais chemins).
drop.addEventListener('click', async () => {
  const picked = await api().choose_files();
  for (const p of picked) files.push({ path: p, venue: "", info_orga: "", is_festival: false });
  renderFiles();
});
// Drag-drop : le drop réel (avec vrais chemins disque) est câblé côté Python
// via l'API DOM pywebview (window.dom → event 'drop' → pywebviewFullPath), qui
// appelle window.onFilesDropped ci-dessous. Ici on ne gère que le retour visuel.
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); });

window.onFilesDropped = (paths) => {
  for (const p of paths) files.push({ path: p, venue: "", info_orga: "", is_festival: false });
  renderFiles();
};

// --- urls ---
function addUrlRow() {
  const div = document.createElement('div');
  div.className = 'url-row';
  div.innerHTML = `<input type="text" placeholder="https://…">
    <label><input type="checkbox" class="follow"> suivre les liens</label>
    <label><input type="checkbox" class="fest"> festival (une ligne)</label>`;
  const venue = document.createElement('input');
  venue.type = 'text'; venue.className = 'u-venue';
  venue.setAttribute('list', 'venues'); venue.placeholder = 'Lieu (si absent)';
  const orga = document.createElement('input');
  orga.type = 'text'; orga.className = 'u-orga'; orga.placeholder = 'Asso/festival (si absent)';
  div.appendChild(venue); div.appendChild(orga);
  const rm = document.createElement('button');
  rm.type = 'button'; rm.textContent = '×'; rm.title = 'Retirer cette URL';
  rm.style.marginLeft = '8px';
  rm.addEventListener('click', () => div.remove());
  div.appendChild(rm);
  document.getElementById('urls').appendChild(div);
}
document.getElementById('add-url').addEventListener('click', addUrlRow);

function collectUrls() {
  return [...document.querySelectorAll('.url-row')].map(r => ({
    url: r.querySelector('input[type=text]').value.trim(),
    follow_links: r.querySelector('.follow').checked,
    is_festival: r.querySelector('.fest').checked,
    venue: r.querySelector('.u-venue').value.trim(),
    info_orga: r.querySelector('.u-orga').value.trim(),
  })).filter(u => u.url);
}

// --- textes collés ---
// Lignes construites via DOM (createElement) : aucune chaîne dynamique injectée
// en innerHTML (mêmes règles de sécurité que le résumé / la progression).
function addTextRow() {
  const div = document.createElement('div');
  div.className = 'text-row';
  div.style.margin = '8px 0';
  const ta = document.createElement('textarea');
  ta.rows = 4; ta.style.width = '100%'; ta.placeholder = 'Colle le texte ici…';
  const venue = document.createElement('input');
  venue.type = 'text'; venue.setAttribute('list', 'venues'); venue.placeholder = 'Lieu (si absent du texte)';
  const orga = document.createElement('input');
  orga.type = 'text'; orga.placeholder = 'Asso / organisateur (si absent)';
  venue.className = 'tx-venue'; orga.className = 'tx-orga'; ta.className = 'tx-text';
  div.appendChild(ta);
  const row2 = document.createElement('div'); row2.style.marginTop = '4px';
  row2.appendChild(venue); row2.appendChild(document.createTextNode(' ')); row2.appendChild(orga);
  const festLabel = document.createElement('label');
  festLabel.style.marginLeft = '8px';
  const fest = document.createElement('input');
  fest.type = 'checkbox'; fest.className = 'tx-fest';
  festLabel.appendChild(fest);
  festLabel.appendChild(document.createTextNode(' festival (une ligne)'));
  row2.appendChild(festLabel);
  const rm = document.createElement('button');
  rm.type = 'button'; rm.textContent = '× retirer ce texte';
  rm.style.marginLeft = '8px';
  rm.addEventListener('click', () => div.remove());
  row2.appendChild(document.createTextNode(' ')); row2.appendChild(rm);
  div.appendChild(row2);
  document.getElementById('texts').appendChild(div);
}
document.getElementById('add-text').addEventListener('click', addTextRow);

function collectTexts() {
  return [...document.querySelectorAll('.text-row')].map(r => ({
    text: r.querySelector('.tx-text').value,
    venue: r.querySelector('.tx-venue').value.trim(),
    info_orga: r.querySelector('.tx-orga').value.trim(),
    is_festival: r.querySelector('.tx-fest').checked,
  })).filter(t => t.text.trim());
}

// Peuple le <datalist> des lieux : options créées via createElement + .value
// (jamais innerHTML — ces noms viennent du backend).
async function loadVenues() {
  const venues = await api().get_venues();
  const dl = document.getElementById('venues');
  dl.textContent = '';
  for (const v of venues) { const o = document.createElement('option'); o.value = v; dl.appendChild(o); }
}

// --- settings ---
function applyTheme(theme) {
  const t = (theme === 'light') ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.getElementById('theme-toggle').textContent = (t === 'dark') ? '☀' : '☾';
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark';
  applyTheme(next);
  api().save_settings({ theme: next });
});
async function loadSettings() {
  const s = await api().get_settings();
  document.getElementById('api-key').value = s.anthropic_api_key || '';
  document.getElementById('email').value = s.tapeur_email || '';
  applyTheme(s.theme || 'dark');
  document.getElementById('reference-year').value = await api().default_reference_year();
  syncMonthMode();
}

// --- mode mois (un mois précis / tous les mois) ---
function monthMode() {
  const r = document.querySelector('input[name="month-mode"]:checked');
  return r ? r.value : 'specific';
}
function syncMonthMode() {
  const all = monthMode() === 'all';
  document.getElementById('month-specific').style.display = all ? 'none' : '';
  document.getElementById('month-all').style.display = all ? '' : 'none';
}
document.querySelectorAll('input[name="month-mode"]').forEach(
  r => r.addEventListener('change', syncMonthMode));
document.getElementById('save-settings').addEventListener('click', async () => {
  await api().save_settings({
    anthropic_api_key: document.getElementById('api-key').value,
    tapeur_email: document.getElementById('email').value,
  });
  alert('Réglages enregistrés.');
});

// --- import config (mode debug) ---
async function importConfig() {
  const cfg = await api().import_config();
  if (cfg && Object.keys(cfg).length) applyConfig(cfg);
}
document.getElementById('import-config').addEventListener('click', importConfig);

function applyConfig(cfg) {
  // fichiers
  files = (cfg.files || []).map(f => ({
    path: f.path || "", venue: f.venue || "", info_orga: f.info_orga || "",
    is_festival: !!f.is_festival,
  }));
  renderFiles();
  // urls
  const urlsBox = document.getElementById('urls'); urlsBox.innerHTML = '';
  (cfg.urls || []).forEach(u => {
    addUrlRow();
    const row = urlsBox.lastElementChild;
    row.querySelector('input[type=text]').value = u.url || "";
    row.querySelector('.follow').checked = !!u.follow_links;
    row.querySelector('.fest').checked = !!u.is_festival;
    row.querySelector('.u-venue').value = u.venue || "";
    row.querySelector('.u-orga').value = u.info_orga || "";
  });
  // textes
  const textsBox = document.getElementById('texts'); textsBox.innerHTML = '';
  (cfg.texts || []).forEach(t => {
    addTextRow();
    const row = textsBox.lastElementChild;
    row.querySelector('.tx-text').value = t.text || "";
    row.querySelector('.tx-venue').value = t.venue || "";
    row.querySelector('.tx-orga').value = t.info_orga || "";
    row.querySelector('.tx-fest').checked = !!t.is_festival;
  });
  // mois
  document.getElementById('months').value = (cfg.months || []).join(', ');
  const mode = (cfg.month_mode === 'all') ? 'all' : 'specific';
  const radio = document.querySelector('input[name="month-mode"][value="' + mode + '"]');
  if (radio) radio.checked = true;
  if (cfg.reference_year) document.getElementById('reference-year').value = cfg.reference_year;
  syncMonthMode();
  // formats
  document.querySelectorAll('.fmt').forEach(c => { c.checked = (cfg.formats || []).includes(c.value); });
  // dossier + append
  if (cfg.out_dir) { outDir = cfg.out_dir; document.getElementById('out-dir').textContent = outDir; }
  // write_mode (repli legacy append)
  const wm = (['create','append','merge'].includes(cfg.write_mode)) ? cfg.write_mode
             : (cfg.append ? 'append' : 'create');
  const wmRadio = document.querySelector('input[name="write-mode"][value="' + wm + '"]');
  if (wmRadio) wmRadio.checked = true;
  document.getElementById('debug-mode').checked = !!cfg.debug;
}

// --- output dir ---
document.getElementById('choose-dir').addEventListener('click', async () => {
  outDir = await api().choose_output_dir();
  document.getElementById('out-dir').textContent = outDir || '(aucun)';
});

// --- run ---
let elapsedTimer = null;
// Instant de départ du run courant (null hors run) : sert à la fois au chrono
// #elapsed et à l'horodatage [m:ss] préfixant chaque ligne de progression.
let runStartedAt = null;

// Temps écoulé formaté « m:ss » (depuis un nombre de millisecondes).
function fmtClock(ms) {
  const secs = Math.floor(ms / 1000);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function startElapsed() {
  const el = document.getElementById('elapsed');
  runStartedAt = Date.now();
  const tick = () => { el.textContent = fmtClock(Date.now() - runStartedAt); };
  tick();
  elapsedTimer = setInterval(tick, 1000);
}

function stopElapsed() {
  if (elapsedTimer !== null) { clearInterval(elapsedTimer); elapsedTimer = null; }
  document.getElementById('elapsed').textContent = '';
}

// Progression poussée par le backend (service.run) : chaque message devient une
// ligne via textContent (jamais innerHTML — mêmes règles de sécurité que le résumé).
window.onProgress = function (msg) {
  const area = document.getElementById('progress');
  const line = document.createElement('div');
  // Préfixe chaque ligne du temps écoulé depuis le début du run (repère
  // temporel « [m:ss] » pendant l'extraction). Hors run : pas de préfixe.
  const stamp = (runStartedAt !== null) ? '[' + fmtClock(Date.now() - runStartedAt) + '] ' : '';
  line.textContent = stamp + msg;
  area.appendChild(line);
};

// Rend le résumé en construisant des nœuds DOM (textContent) : jamais d'HTML
// interpolé à partir de chaînes venant du backend (noms de lieux, chemins…).
function renderSummary(results) {
  const summary = document.getElementById('summary');
  summary.textContent = '';
  results.forEach((r, i) => {
    if (i > 0) summary.appendChild(document.createTextNode('\n'));
    const head = document.createElement('div');
    head.className = 'result-head';
    head.textContent = '[' + (r.month || 'tous') + '] ' + r.n_events + ' events';
    summary.appendChild(head);
    // Groupe les events par source (en préservant l'ordre de première
    // apparition) : un en-tête lisible par source, puis ses events indentés.
    const groups = new Map();
    for (const ev of (r.events || [])) {
      const key = ev.source_label || ev.source || '(source inconnue)';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(ev);
    }
    for (const [source, evs] of groups) {
      const srcHead = document.createElement('div');
      srcHead.className = 'source-head';
      srcHead.textContent = '  ' + source;
      summary.appendChild(srcHead);
      for (const ev of evs) {
        const line = document.createElement('div');
        const parts = [ev.date, ev.festival, ev.artistes, ev.lieu, ev.ville, ev.heure].filter(Boolean);
        line.textContent = '    • ' + parts.join(' — ');
        summary.appendChild(line);
      }
    }
    for (const f of (r.files || [])) {
      const line = document.createElement('div');
      line.textContent = '  ' + f;
      summary.appendChild(line);
    }
    for (const a of (r.alerts || [])) {
      const line = document.createElement('div');
      line.className = 'alert';
      line.textContent = '  ⚠ ' + a;
      summary.appendChild(line);
    }
  });
}

document.getElementById('run').addEventListener('click', async () => {
  const summary = document.getElementById('summary');

  // Garde : sélection vide.
  const formats = [...document.querySelectorAll('.fmt:checked')].map(c => c.value);
  if (formats.length === 0) {
    summary.textContent = 'Choisis au moins un format de sortie.';
    return;
  }
  const mode = monthMode();
  const months = document.getElementById('months').value.split(',').map(s => s.trim()).filter(Boolean);
  const refYear = document.getElementById('reference-year').value.trim();
  if (mode === 'specific') {
    if (months.length === 0) {
      summary.textContent = 'Aucun mois ciblé — saisis au moins un mois.';
      return;
    }
    if (!months.every(m => /^\d{4}-\d{2}$/.test(m))) {
      summary.textContent = 'Mois invalide : utilise le format AAAA-MM (ex. 2026-11).';
      return;
    }
  } else {
    if (!/^\d{4}$/.test(refYear)) {
      summary.textContent = 'Année de référence invalide : format AAAA (ex. 2026).';
      return;
    }
  }
  const chosenFiles = collectFiles();
  const urls = collectUrls();
  const texts = collectTexts();
  if (chosenFiles.length === 0 && urls.length === 0 && texts.length === 0) {
    summary.textContent = 'Ajoute au moins un fichier, une URL ou un texte.';
    return;
  }

  const runBtn = document.getElementById('run');
  runBtn.disabled = true;
  runBtn.textContent = 'Extraction en cours…';
  summary.textContent = 'Extraction en cours…';
  document.getElementById('progress').textContent = '';
  startElapsed();
  const payload = {
    files: chosenFiles,
    urls: urls,
    texts: texts,
    months: months,
    month_mode: mode,
    reference_year: refYear,
    formats: formats,
    out_dir: outDir,
    write_mode: (document.querySelector('input[name="write-mode"]:checked') || {}).value || 'create',
    debug: document.getElementById('debug-mode').checked,
    api_key: document.getElementById('api-key').value,
    tapeur_email: document.getElementById('email').value,
  };
  try {
    const res = await api().run_extraction(payload);
    if (res.error) { summary.textContent = 'Erreur : ' + res.error; return; }
    renderSummary(res.results);
  } finally {
    stopElapsed();
    runBtn.disabled = false;
    runBtn.textContent = 'Lancer';
  }
});

window.addEventListener('pywebviewready', () => { loadSettings(); loadVenues(); });
</script>
</body>
</html>
